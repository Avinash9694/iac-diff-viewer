[package]
name = "iac-diff"
version = "0.1.0"
edition = "2021"
description = "Semantic resource-level diff for CloudFormation and Terraform documents, with risk tagging"
license = "MIT"
repository = "https://github.com/Avinash9694/iac-diff-viewer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
